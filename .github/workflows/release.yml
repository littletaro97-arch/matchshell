name: Publish stable APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.1
        required: true
      version_code:
        description: Increasing integer version code
        required: true
        type: number
      release_notes:
        description: Release notes
        required: true
        type: string
      rollout_percent:
        description: Percentage of devices offered the update
        required: true
        default: 100
        type: number
      minimum_supported_version_code:
        description: Versions below this value must update
        required: true
        default: 100
        type: number
      mandatory:
        description: Require all eligible users to update
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          MINIMUM_SUPPORTED: ${{ inputs.minimum_supported_version_code }}
        run: |
          test "$VERSION_CODE" -ge 100
          test "$ROLLOUT_PERCENT" -ge 0
          test "$ROLLOUT_PERCENT" -le 100
          test "$MINIMUM_SUPPORTED" -ge 1

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.MATCHSHELL_KEYSTORE_BASE64 }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$UPDATE_PRIVATE_KEY"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/matchshell-release.keystore"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/update-private.pem"
          chmod 600 "$RUNNER_TEMP/matchshell-release.keystore" "$RUNNER_TEMP/update-private.pem"

      - name: Build and verify
        env:
          MATCHSHELL_KEYSTORE_FILE: ${{ runner.temp }}/matchshell-release.keystore
          MATCHSHELL_KEYSTORE_PASSWORD: ${{ secrets.MATCHSHELL_KEYSTORE_PASSWORD }}
          MATCHSHELL_KEY_ALIAS: ${{ secrets.MATCHSHELL_KEY_ALIAS }}
          MATCHSHELL_KEY_PASSWORD: ${{ secrets.MATCHSHELL_KEY_PASSWORD }}
        run: |
          gradle clean lintPdfRelease assemblePdfRelease \
            -PVERSION_NAME='${{ inputs.version_name }}' \
            -PVERSION_CODE='${{ inputs.version_code }}'

      - name: Prepare release asset
        id: release
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          tag="v${VERSION_NAME}"
          asset="matchshell-${tag}-arm64.apk"
          mkdir -p public/updates release
          cp app/build/outputs/apk/pdf/release/app-pdf-release.apk "release/$asset"
          sha="$(sha256sum "release/$asset" | cut -d' ' -f1)"
          size="$(stat -c%s "release/$asset")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Synchronize source to Gitee
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
        run: |
          test -n "$GITEE_ACCESS_TOKEN"
          test -n "$GITEE_USERNAME"
          test -n "$GITEE_OWNER"
          test -n "$GITEE_REPOSITORY"
          auth="$(printf '%s' "$GITEE_USERNAME:$GITEE_ACCESS_TOKEN" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $auth" push \
            "https://gitee.com/$GITEE_OWNER/$GITEE_REPOSITORY.git" \
            HEAD:main --follow-tags

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create '${{ steps.release.outputs.tag }}' \
            "release/${{ steps.release.outputs.asset }}" \
            --title '${{ steps.release.outputs.tag }}' \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Publish APK to Gitee Release
        id: gitee
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          test -n "$GITEE_ACCESS_TOKEN"
          test -n "$GITEE_OWNER"
          test -n "$GITEE_REPOSITORY"

          release_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $GITEE_ACCESS_TOKEN" \
            --data-urlencode "tag_name=$TAG" \
            --data-urlencode "name=$TAG" \
            --data-urlencode "body=$RELEASE_NOTES" \
            --data-urlencode "target_commitish=$GITHUB_SHA" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPOSITORY/releases")"
          release_id="$(jq -er '.id' <<<"$release_json")"

          asset_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $GITEE_ACCESS_TOKEN" \
            --form "file=@release/$ASSET" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPOSITORY/releases/$release_id/attach_files")"
          download_url="$(jq -er '.browser_download_url' <<<"$asset_json")"
          case "$download_url" in
            https://gitee.com/*) ;;
            *) echo "Unexpected Gitee download URL" >&2; exit 1 ;;
          esac
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"

      - name: Create signed update manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          MINIMUM_SUPPORTED: ${{ inputs.minimum_supported_version_code }}
          MANDATORY: ${{ inputs.mandatory }}
          APK_URL: ${{ steps.gitee.outputs.download_url }}
          APK_SHA: ${{ steps.release.outputs.sha }}
          APK_SIZE: ${{ steps.release.outputs.size }}
        run: |
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson minimumSupportedVersionCode "$MINIMUM_SUPPORTED" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA" \
            --argjson size "$APK_SIZE" \
            --argjson mandatory "$MANDATORY" \
            --argjson rolloutPercent "$ROLLOUT_PERCENT" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{schemaVersion:1, versionCode:$versionCode, versionName:$versionName, minimumSupportedVersionCode:$minimumSupportedVersionCode, apkUrl:$apkUrl, sha256:$sha256, size:$size, mandatory:$mandatory, rolloutPercent:$rolloutPercent, releaseNotes:[$releaseNotes]}' \
            > public/updates/stable.json
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-private.pem" -out "$RUNNER_TEMP/stable.sig" public/updates/stable.json
          base64 -w0 "$RUNNER_TEMP/stable.sig" > public/updates/stable.json.sig
          printf '<!doctype html><meta charset="utf-8"><title>MatchShell updates</title><p>MatchShell stable update service.</p>' > public/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy signed update manifest
        id: pages
        uses: actions/deploy-pages@v4
