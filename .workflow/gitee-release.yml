version: '1.0'
name: matchshell-gitee-release
displayName: MatchShell-Gitee-Release
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - v
stages:
  - stage:
    name: publish-release
    displayName: publish-release
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: upload-apk
        displayName: upload-apk-to-gitee-release
        commands:
          - export RELEASE_REF="${GITEE_REF_NAME:-${GITEE_REF:-}}"; export VERSION_NAME="${RELEASE_REF##*/}"; export VERSION_NAME="${VERSION_NAME#v}"; test -n "$VERSION_NAME"
          - export GITEE_OWNER="littletaro97"
          - export GITEE_REPOSITORY="matchshell"
          - bash tools/publish-gitee-release.sh
